<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EDE1">
<title>Jael · Estudo interativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Nunito:wght@400;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#F4EDE1;--sf2:#FBF6EE;--ac:#B5562F;--ac2:#E8C39E;--tag:#F1DCCB;--tagt:#8A3E1F;--tx:#3B2A20;--mu:#8B7363;--ok:#5E7B3A;--okbg:#E3EAD3;--okbd:#8FA66A;--no:#A33A2A;--slot:#EFE3D2;--slotbd:#D4A880;--fr:'Fraunces',Georgia,serif;--nu:'Nunito',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--nu);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
a{color:var(--ac)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:1px solid var(--ac2);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.on{background:var(--tag);border-color:var(--ac);color:var(--tagt)}
.btn.round{width:46px;height:46px;border-radius:50%;padding:0;font-size:22px;flex-shrink:0}
.mu{color:var(--mu)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--tag);color:var(--tagt);white-space:nowrap}
.pill.ok{background:var(--okbg);color:#3E5420}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--mu);background:var(--sf2);border:1px solid #EFE3D2;border-radius:10px;padding:9px 11px;line-height:1.45}
.note code{background:#fff;padding:1px 5px;border-radius:4px}
.hl{background:var(--tag);color:var(--tagt);padding:0 6px;border-radius:6px;font-style:normal}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.qr{background:#fff;padding:8px;border-radius:12px}
.qr img,.qr canvas{width:100%!important;height:100%!important}

/* ===== PALCO (TV e prévia) — desenhado em 1600x900 ===== */
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;background:var(--bg);color:var(--tx);font-family:var(--nu);transform-origin:0 0;overflow:hidden;padding:56px 64px;display:flex;flex-direction:column}
.stage .split{display:grid;grid-template-columns:36% minmax(0,1fr);gap:56px;flex:1;min-height:0}
.stage .col{display:flex;flex-direction:column;gap:24px;min-width:0;min-height:0;flex:1}
.stage .col.mid{justify-content:center}
.stage .img{border-radius:28px;background:var(--slot) center/cover no-repeat;min-height:0}
.stage .row2{display:flex;justify-content:space-between;align-items:center;gap:20px}
.stage .tag{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;font-size:22px;padding:7px 20px;border-radius:999px;background:var(--tag);color:var(--tagt)}
.stage .tag.ok{background:var(--okbg);color:#3E5420}
.stage .tag i{font-size:26px}
.stage .kind{font-size:22px;color:var(--mu);display:flex;align-items:center;gap:8px}
.stage .q{font:500 46px/1.2 var(--fr)}
.stage .ttl{font:500 130px/1 var(--fr);color:var(--ac)}
.stage .sub{font:italic 500 42px/1.2 var(--fr)}
.stage .big{font-size:26px}
.stage .foot{margin-top:auto;font-size:22px;color:var(--mu);display:flex;align-items:center;gap:14px}
.stage .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.stage .fit{flex:0 1 auto;min-height:0;overflow:hidden}
.stage .opts{display:flex;flex-direction:column;gap:16px}
.stage .opt{background:#fff;border:2px solid var(--ac2);border-radius:22px;padding:16px 24px;font-size:34px;display:flex;align-items:center;gap:20px;transition:.25s}
.stage .opt.sel{background:var(--ac);border-color:var(--ac);color:#fff}
.stage .opt.dim,.stage .vfb.dim{opacity:.45}
.stage .lt{width:56px;height:56px;border-radius:50%;background:var(--tag);color:var(--tagt);font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stage .sel .lt{background:#fff;color:var(--ac)}
.stage .vf{display:grid;grid-template-columns:1fr 1fr;gap:28px;flex:1;min-height:0;max-height:420px}
.stage .vfb{background:#fff;border:3px solid var(--ac2);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:500 48px var(--fr);transition:.25s}
.stage .vfb i{font-size:76px;color:var(--ac)}
.stage .vfb.sel{background:var(--ac);border-color:var(--ac);color:#fff}
.stage .vfb.sel i{color:#fff}
.stage .mapbox{min-height:0;display:flex;align-items:center;justify-content:center}
.stage .lg{flex:1;min-height:0;display:grid;grid-template-columns:30% 1fr 42%}
.stage .lgc{display:grid;align-items:center;gap:14px}
.stage .lgi{background:#fff;border:3px solid var(--ac2);border-radius:20px;padding:12px 20px;font-size:28px;display:flex;align-items:center;gap:14px;transition:.2s}
.stage .dot{width:20px;height:20px;border-radius:50%;background:var(--ac2);flex-shrink:0}
.stage .wave{display:flex;gap:5px;align-items:center;height:34px}
.stage .wave span{width:6px;border-radius:3px;background:var(--ac);height:8px}
.stage .wave.on span{animation:wv 1s ease-in-out infinite}
.stage .wave span:nth-child(2n){animation-delay:.2s}.stage .wave span:nth-child(3n){animation-delay:.4s}.stage .wave span:nth-child(5n){animation-delay:.6s}
@keyframes wv{0%,100%{height:8px}50%{height:30px}}
.stage .ref{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;font-size:24px;color:var(--ac);background:#fff;border:2px solid var(--ac2);border-radius:999px;padding:4px 18px}
.stage .ptxt{font-size:36px;line-height:1.6}
.stage .bar{height:10px;background:var(--ac2);border-radius:5px;overflow:hidden;flex:1}
.stage .bar div{height:100%;background:var(--ac);width:0}
.stage .dots{display:flex;gap:10px;align-items:center}
.stage .dots span{width:16px;height:16px;border-radius:50%;background:var(--ac2)}
.stage .dots span.on{width:40px;border-radius:8px;background:var(--ac)}
.stage .atl{font:500 54px/1.2 var(--fr);color:var(--ac)}
.stage .dv{width:90px;height:5px;border-radius:3px;background:var(--ac2);flex-shrink:0}
.stage .atx{font-size:34px;line-height:1.65}
.stage .vslot{flex:1;min-height:0;background:#2A1E17;border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--bg)}
.stage .vslot video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.stage .pap{flex:1;min-height:0;background:#fff;border:2px solid var(--ac2);border-radius:24px;padding:24px 30px;font:500 54px/1.3 'Caveat',cursive;overflow:hidden;transition:border-color .3s}
.stage .pap.sent{border-color:var(--okbd)}
.stage .papph{font:26px var(--nu);color:#B59A84}
.stage .cur{display:inline-block;width:4px;height:48px;background:var(--ac);vertical-align:-6px;margin-left:4px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.stage .steps{display:flex;gap:8px}
.stage .steps span{width:46px;height:8px;border-radius:4px;background:var(--ac2)}
.stage .steps span.on{background:var(--ac)}
.stage .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;flex:1;min-height:0;align-content:center}
.stage .ab{background:#fff;border:2px solid var(--ac2);border-radius:24px;padding:26px 30px;display:flex;flex-direction:column;gap:14px;animation:up .5s ease both}
.stage .ans{font:500 56px/1.15 var(--fr);display:flex;align-items:center;gap:16px}
.stage .pr{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px 14px;font-size:28px;align-items:center}
.stage .cr{margin-top:auto;background:var(--okbg);border:2px solid var(--okbd);border-radius:22px;padding:18px 24px;color:#3E5420;display:flex;gap:14px;font-size:26px;line-height:1.4;animation:up .5s .5s ease both}
.stage .cr i{font-size:32px}
.stage .cgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:22px}
.stage .gc{background:#fff;border:2px solid var(--ac2);border-radius:22px;padding:18px 22px;display:flex;flex-direction:column;gap:8px;font-size:24px;animation:up .4s ease both;overflow:hidden}
.stage .gq{font:500 28px/1.2 var(--fr)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stage .band{height:330px;flex-shrink:0;border-radius:24px;background:var(--slot) center/cover no-repeat;margin-bottom:28px}
.stage .egrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 44%;gap:36px}
.stage .etl{font:500 44px/1.15 var(--fr);color:var(--ac)}
.stage .etx{font-size:25px;line-height:1.55}
.stage .pf{background:#fff;border:2px solid var(--ac2);border-radius:22px;padding:18px 24px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:21px;line-height:1.35;align-content:start;overflow:hidden}
.stage .pf b{color:var(--ac);font-weight:600}
.stage .pfn{grid-column:1/3;font:500 26px var(--fr);margin-bottom:4px}
.stage .quote{font:italic 500 34px/1.6 var(--fr);border-left:6px solid var(--ac2);padding-left:30px}
.stage .join{display:flex;align-items:center;gap:28px;background:#fff;border:2px solid var(--ac2);border-radius:24px;padding:20px 28px;align-self:flex-start;margin-top:10px}
.stage .qr{width:180px;height:180px;padding:10px;flex-shrink:0}
.stage .code{font:500 64px/1.1 var(--fr);letter-spacing:10px;color:var(--ac)}

/* ===== mapa (TV, celular e editor) ===== */
.mapw{position:relative;display:inline-block;line-height:0}
.mapw img{display:block;max-width:100%;border-radius:18px}
.mapw .noimg{background:var(--slot);border:2px dashed var(--slotbd);border-radius:18px;display:flex;align-items:center;justify-content:center;color:#9A6B48}
.pin{position:absolute;display:flex;align-items:center;gap:.35em;transform:translate(-.9em,-50%);line-height:1.2;white-space:nowrap;cursor:pointer}
.pin .pd{width:1.8em;height:1.8em;border-radius:50%;background:var(--ac);color:#fff;border:.13em solid #fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.pin .pl{background:#fff;border:1px solid var(--ac2);border-radius:.45em;padding:.1em .45em;font-size:.85em}
.pin.sel .pd{background:var(--tx);box-shadow:0 0 0 .3em rgba(59,42,32,.25)}
.pin.dim{opacity:.45}
.mapw.tv{font-size:26px}
.mapw.tv img{max-height:680px}
.mapw.tv .noimg{width:860px;height:600px;font-size:70px}
.mapw.cel{display:block;font-size:12px}
.mapw.cel img{width:100%}
.mapw.cel .noimg{width:100%;aspect-ratio:4/3;font-size:40px}
.mapw.cel .pin.dim{opacity:1}
.mapw.ed{font-size:12px;cursor:crosshair}
.mapw.ed img{max-height:420px}
.mapw.ed .noimg{width:520px;max-width:100%;height:380px;font-size:50px}

/* ===== TV ===== */
body.m-tv{overflow:hidden;background:#2A1E17}
#tvwrap{position:fixed;inset:0;overflow:hidden}
.tvov{position:fixed;inset:0;background:rgba(42,30,23,.94);display:flex;align-items:center;justify-content:center;text-align:center;z-index:10}
.tvov .ovt{font:500 84px var(--fr);color:#F4EDE1}
.tvov .ovs{color:#E8C39E;margin:6px 0 26px;font-size:18px}
.tvov .ovh{color:#E8C39E;margin-top:14px;font-size:14px}
.badge{position:fixed;right:10px;bottom:6px;font-size:11px;color:#8B7363;opacity:.55;z-index:3}

/* ===== CELULAR ===== */
.ph{max-width:540px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.phh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ac2);z-index:2}
.phh .t{font:500 20px var(--fr);color:var(--ac)}
.phh .s{font-size:12px;color:var(--mu)}
.phm{flex:1;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px}
.ptag{align-self:flex-start;font-size:12px;padding:4px 11px;border-radius:999px;background:var(--tag);color:var(--tagt);display:inline-flex;gap:5px;align-items:center}
.ptag.ok{background:var(--okbg);color:#3E5420}
.pq{font:500 22px/1.25 var(--fr)}
.pbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--ac2);border-radius:14px;padding:14px;font-size:17px;color:var(--tx)}
.pbtn.sel{background:var(--ac);border-color:var(--ac);color:#fff}
.plt{width:32px;height:32px;border-radius:50%;background:var(--tag);color:var(--tagt);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.pbtn.sel .plt{background:#fff;color:var(--ac)}
.pvf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn.big{flex-direction:column;justify-content:center;min-height:130px;font:500 20px var(--fr);text-align:center}
.pbtn.big i{font-size:32px}
.card{background:#fff;border:1px solid var(--ac2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ptext{font-size:17px;line-height:1.6}
.pquote{font:italic 500 17px/1.65 var(--fr);border-left:4px solid var(--ac2);padding-left:12px}
.pimg{width:100%;border-radius:14px;display:block}
.pta{width:100%;min-height:200px;border:1.5px solid var(--ac2);border-radius:14px;padding:12px;font:17px/1.5 var(--nu);color:var(--tx);resize:vertical;background:#fff}
.hint{font-size:13px;color:var(--mu);text-align:center}
.pcen{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:30px 10px}
.bigt{font:500 48px var(--fr);color:var(--ac)}
.lgp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lgcol{display:flex;flex-direction:column;gap:8px}
.lgb{background:#fff;border:1.5px solid var(--ac2);border-radius:12px;padding:10px 8px;font-size:14px;min-height:56px;color:var(--tx)}
.lgb.act{outline:3px solid var(--tx);outline-offset:1px}
.grp2{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--ac2)}
.inp{width:100%;font:17px var(--nu);border:1.5px solid var(--ac2);border-radius:12px;padding:12px;color:var(--tx);background:#fff}

/* ===== CONTROLE ===== */
body.m-ctl{background:var(--sf2);min-height:100vh}
.cbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--ac2);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.cbar .lgo{font:500 20px var(--fr);color:var(--ac);margin-right:4px}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tabs button{background:none;border:none;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--mu);display:inline-flex;gap:6px;align-items:center}
.tabs button.on{background:var(--tag);color:var(--tagt)}
.est{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;padding:16px;align-items:start}
.tlist,.edl{background:#fff;border:1px solid var(--ac2);border-radius:14px;padding:8px;max-height:calc(100vh - 92px);overflow:auto;position:sticky;top:76px}
.trow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:7px 8px;color:var(--tx)}
.trow:hover{background:var(--sf2)}
.trow.on{background:var(--tag)}
.n{width:24px;height:24px;border-radius:50%;background:var(--sf2);border:1px solid var(--ac2);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.trow.on .n,.edrow.on .n{background:var(--ac);color:#fff;border-color:var(--ac)}
.trow .tx,.edrow .lb{min-width:0;flex:1}
.trow b,.edrow .lb b{display:block;font-size:13px;font-weight:600}
.trow small,.edrow .lb small{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;gap:8px;flex-wrap:wrap}
.prev{position:relative;width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--ac2);background:var(--bg)}
.ctx{background:#fff;border:1px solid var(--ac2);border-radius:14px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}
.nav .btn{padding:14px;font-size:16px}
.cbar2{height:6px;background:var(--slot);border-radius:3px;overflow:hidden}
.cbar2 div{height:100%;background:var(--ac)}
.lrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.lrow a{word-break:break-all}
.ed{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px;padding:16px;align-items:start}
.edl{display:flex;flex-direction:column;gap:8px;padding:10px}
.edol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.edrow{display:flex;align-items:center;gap:6px;padding:6px;border-radius:10px;border:1px solid transparent}
.edrow:hover{background:var(--sf2)}
.edrow.on{background:var(--tag);border-color:var(--ac)}
.edrow.drop{border-top:3px solid var(--ac)}
.edrow .hd{cursor:grab;color:var(--mu)}
.edrow .lb{cursor:pointer}
.ib{background:none;border:none;color:var(--mu);padding:4px;border-radius:6px;font-size:16px;line-height:1}
.ib:hover{background:var(--tag);color:var(--tagt)}
.edf{background:#fff;border:1px solid var(--ac2);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.fh{margin:0;font:500 20px var(--fr)}
.fl{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mu)}
.fl input:not([type=radio]),.fl textarea,.fl select,.tin,.tin2,select{font:15px/1.4 var(--nu);color:var(--tx);border:1px solid var(--ac2);border-radius:10px;padding:8px 10px;background:#fff;min-width:0}
.fl textarea{resize:vertical}
.tin{width:110px}
.grp{border:1px solid var(--ac2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--sf2)}
.grp h4{margin:0;font:500 15px var(--fr);display:flex;gap:6px;align-items:center}
details.grp summary{cursor:pointer;font-size:14px;color:var(--tx)}
.imgf{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.imgf img{max-width:260px;max-height:150px;border-radius:10px;display:block;border:1px solid var(--ac2)}
.noimg2{width:240px;height:100px;border:1.5px dashed var(--slotbd);background:var(--slot);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;color:#9A6B48;font-size:13px}
.an{max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.anh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.acard{background:#fff;border:1px solid var(--ac2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.atext{font-size:15px;line-height:1.55;color:var(--tx)}
.qrc{width:150px;height:150px;flex-shrink:0}
@media(max-width:900px){.est,.ed{grid-template-columns:1fr}.tlist,.edl{position:static;max-height:300px}}

/* ===== ENTRADA ===== */
.land{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.land .t1{font:500 76px/1 var(--fr);color:var(--ac)}
.land .t2{font:italic 500 22px var(--fr)}

  }

  const subs = [];

    get: async p => { const v = getAt(p); return v == null ? null : clone(v); },

   ===================================================================== */
function modoTV() {
  document.body.className = 'm-tv'; document.title = 'Jael · TV';
  app.innerHTML = `<div id="tvwrap"><div class="stage" id="stage"></div></div><div id="vidhold" style="display:none"><video id="vid" playsinline preload="metadata"></video></div><audio id="aud" preload="auto"></audio>
  <div class="tvov" id="tvov"><div><div class="ovt">Jael</div><div class="ovs">Sala ${esc(SALA)}${DB.remoto ? '' : ' · modo de teste local'}</div><button class="btn pri" id="tvgo" style="font-size:22px;padding:16px 28px"><i class="ti ti-player-play"></i> Iniciar apresentação</button><div class="ovh">Toque para ativar o som e a tela cheia</div></div></div>
  <div class="badge">${DB.remoto ? '' : 'teste local · '}sala ${esc(SALA)}</div>`;
  const stage = $('#stage'), aud = $('#aud'), vid = $('#vid'), hold = $('#vidhold');
  let C = norm(DEF()), E = { idx: 0, sub: 0 }, R = {}, A = {}, D = {}, PART = null;
  let lastIdx = -1, lastN, lastPar = -1, lastRep = 0;
  const escala = () => { const s = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = `translate(${(innerWidth - 1600 * s) / 2}px,${(innerHeight - 900 * s) / 2}px) scale(${s})`; };
  addEventListener('resize', escala); escala();
  $('#tvgo').onclick = () => { $('#tvov').style.display = 'none'; try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
  const cur = () => C.telas[Math.min(E.idx || 0, C.telas.length - 1)];
  const midiaEl = t => t && t.tipo === 'video' ? vid : aud;
  const posLocal = () => { const t = cur(); if (!t) return null; const el = midiaEl(t); return { tela: t.id, t: el.currentTime || 0, tocando: !el.paused, dur: isFinite(el.duration) ? el.duration : 0, erro: !!(el.error && el.getAttribute('src')) ? (el.getAttribute('src') || '') : '' }; };
  const setSrc = (el, src) => { if (src && el.getAttribute('src') !== src) { el.setAttribute('src', src); el.load(); } };
  const seekReady = (el, s) => { if (el.readyState >= 1) el.currentTime = s; else el.addEventListener('loadedmetadata', () => { el.currentTime = s; }, { once: true }); };
  function trocaTela(t) {
    aud.pause(); vid.pause(); if (!t) return;
    if (t.tipo === 'leitura') { const src = arqMidia(t.audio || C.meta.audio, 'mp3'); if (src) { setSrc(aud, src); if (temMarcas(t)) seekReady(aud, t.paragrafos[0].inicio); } }
    if (t.tipo === 'video' && t.arquivo) { setSrc(vid, arqMidia(t.arquivo, 'mp4')); seekReady(vid, 0); }
    report(true);
  }
  function render() {
    const t = cur();
    if (E.idx !== lastIdx) { lastIdx = E.idx; trocaTela(t); }
    const pos = posLocal();
    lastPar = t && t.tipo === 'leitura' ? parIdx(t, E, pos) : -1;
    if (vid.parentNode !== hold) hold.appendChild(vid);
    stage.innerHTML = stageHTML(t, { C, E, R, A, D, PART, pos, idx: E.idx, preview: false, vErro: t && t.tipo === 'video' && !!(vid.error && vid.getAttribute('src')) });
    postStage(stage);
    const slot = $('#videoSlot'); if (slot) slot.appendChild(vid);
  }
  function report(force) { const now = Date.now(); if (!force && now - lastRep < 500) return; lastRep = now; const p = posLocal(); if (p) DB.set(P('midiaPos'), { tela: p.tela, t: +p.t.toFixed(2), dur: +(+p.dur).toFixed(1), tocando: p.tocando, erro: p.erro || null }); }
  function cmd(m) {
    const t = cur(); if (!t || (t.tipo !== 'leitura' && t.tipo !== 'video')) return;
    const el = midiaEl(t); if (!el.getAttribute('src')) return;
    if (m.acao === 'play') {
      if (t.tipo === 'leitura' && temMarcas(t)) { const a = t.paragrafos[0].inicio; if (el.currentTime < a - 0.3 || el.currentTime >= t.fim - 0.3) el.currentTime = a; }
      else if (el.ended) el.currentTime = 0;
      el.play().catch(() => { $('#tvov').style.display = 'flex'; });
    } else if (m.acao === 'pause') el.pause();
    else if (m.acao === 'seek') { el.currentTime = Math.max(0, +m.t || 0); if (m.play) el.play().catch(() => { $('#tvov').style.display = 'flex'; }); }
    else if (m.acao === 'rel') el.currentTime = Math.max(0, el.currentTime + (+m.t || 0));
    report(true);
  }
  aud.addEventListener('timeupdate', () => {
    const t = cur();
    if (t && t.tipo === 'leitura') {
      if (temMarcas(t) && aud.currentTime >= t.fim && !aud.paused) aud.pause();
      const k = parIdx(t, E, posLocal());
      if (k !== lastPar) render(); else { const b = $('#sprog'); if (b) b.style.width = progLeitura(t, posLocal()) * 100 + '%'; }
    }
    report();
  });
  vid.addEventListener('timeupdate', () => report());
  ['play', 'pause', 'seeked', 'ended'].forEach(ev => { aud.addEventListener(ev, () => { if (cur()?.tipo === 'leitura') render(); report(true); }); vid.addEventListener(ev, () => report(true)); });
  vid.addEventListener('error', () => { if (cur()?.tipo === 'video') render(); report(true); });
  aud.addEventListener('error', () => report(true));
  vid.addEventListener('loadeddata', () => { if (cur()?.tipo === 'video') report(true); });
  DB.on(P('conteudo'), v => { C = norm(v || DEF()); render(); });
  DB.on(P('estado'), v => {
    E = Object.assign({ idx: 0, sub: 0 }, v || {}); render();
    const m = E.midia;
    if (m && m.n !== lastN) { if (lastN !== undefined) cmd(m); lastN = m.n; } else if (!m && lastN === undefined) lastN = null;
  });
  DB.on(P('respostas'), v => { R = v || {}; render(); });
  DB.on(P('anotacoes'), v => { A = v || {}; if (cur()?.tipo === 'medite') render(); });
  DB.on(P('digitando'), v => { D = v || {}; if (cur()?.tipo === 'medite') render(); });
  DB.on(P('participante'), v => { const mudou = (v && v.nome) !== (PART && PART.nome); PART = v; if (mudou) render(); });
  if (document.fonts) document.fonts.ready.then(() => render());
}

  /* ---- eventos do controle ---- */
  cm.addEventListener('click', async e => {
    const me = e.target.closest('.mapedit');
    if (me && !e.target.closest('button')) { const q = C.perguntas[me.dataset.pid], im = me.querySelector('img,.noimg'); if (!q || !im || !q.pinos[selPin]) return; const r = im.getBoundingClientRect(); q.pinos[selPin].x = Math.round(Math.max(0, Math.min(100, (e.clientX - r.left) / r.width * 100)) * 10) / 10; q.pinos[selPin].y = Math.round(Math.max(0, Math.min(100, (e.clientY - r.top) / r.height * 100)) * 10) / 10; touch(); renderEditar(); return; }

        case 'add': { const at = typeof edSel === 'number' ? edSel + 1 : C.telas.length; C.telas.splice(at, 0, novaTela($('#addTipo').value)); edSel = at; touch(); return renderEditar(); }

        case 'novo': {
          if (!confirm('Começar um novo estudo? As respostas atuais vão para "Estudos anteriores" e as perguntas voltam a ficar em branco.')) return;
          const k = Date.now(); await DB.set(P('historico/' + k), { titulo: C.meta.titulo + ' · ' + C.meta.subtitulo, anotacoes: A || {}, respostas: R || {} });
          await DB.set(P('respostas'), null); await DB.set(P('anotacoes'), null); await DB.set(P('digitando'), null);
          await DB.set(P('estado'), { idx: 0, sub: 0, estudoId: k, midia: { acao: 'pause', n: Date.now() } }); toast('Novo estudo começado'); return;
        }
        case 'sala': { const v = ($('#novaSala').value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (!v) return toast('Digite um código'); location.href = urlBase() + '?modo=controle&sala=' + v; return; }
      }
    }
  });
  cm.addEventListener('input', e => { const el = e.target; if (!el.dataset.b || el.dataset.rr) return; let v = el.value; if (el.dataset.t === 'time') v = parseT(v); else if (el.dataset.t === 'num') v = +v; else if (el.dataset.t === 'bool') v = v === 'true'; setP(el.dataset.b, v); touch(); refreshList(); });
  cm.addEventListener('change', async e => {
    const el = e.target;
    if (el.dataset.b && el.dataset.rr) { setP(el.dataset.b, el.value); touch(); renderEditar(); return; }
    if (el.dataset.img && el.files && el.files[0]) { try { setP(el.dataset.img, await lerImagem(el.files[0])); touch(); renderEditar(); } catch (err) { toast('Não deu para ler a imagem'); } return; }
    if (el.id === 'impf' && el.files && el.files[0]) { try { const o = JSON.parse(await el.files[0].text()); if (!o || !o.telas) throw 0; C = norm(o); edSel = 0; touch(); renderEditar(); toast('Conteúdo importado'); } catch (err) { toast('Arquivo inválido'); } }
  });
  cm.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details[data-pid]') && e.target.open) bancoAberto = e.target.dataset.pid; }, true);
  cm.addEventListener('dragstart', e => { const r = e.target.closest && e.target.closest('.edrow'); if (!r) return; dragI = +r.dataset.row; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragI)); });
  cm.addEventListener('dragover', e => { const r = e.target.closest && e.target.closest('.edrow'); if (!r || dragI == null) return; e.preventDefault(); cm.querySelectorAll('.edrow.drop').forEach(x => x.classList.remove('drop')); r.classList.add('drop'); });
  cm.addEventListener('drop', e => { const r = e.target.closest && e.target.closest('.edrow'); if (!r || dragI == null) return; e.preventDefault(); const f = dragI; dragI = null; moveTela(f, +r.dataset.row); });
  cm.addEventListener('dragend', () => { dragI = null; cm.querySelectorAll('.edrow.drop').forEach(x => x.classList.remove('drop')); });

  DB.get(P('conteudo')).then(v => {
    if (!v) { let bk = null; try { bk = JSON.parse(localStorage.getItem('jael-backup-' + SALA)); } catch (e) {} C = norm(bk || DEF()); DB.set(P('conteudo'), C); } else C = norm(v);
    DB.on(P('estado'), v2 => { E = Object.assign({ idx: 0, sub: 0 }, v2 || {}); renderEstudo(); });
    DB.on(P('respostas'), v2 => { R = v2 || {}; renderEstudo(); });
    DB.on(P('anotacoes'), v2 => { A = v2 || {}; renderEstudo(); renderAnot(); });
    DB.on(P('digitando'), v2 => { D = v2 || {}; if (cur()?.tipo === 'medite') renderEstudo(); });
    DB.on(P('participante'), v2 => { const mudou = (v2 && v2.nome) !== (PART && PART.nome); PART = v2; pres(); if (mudou && cur()?.tipo === 'abertura') renderEstudo(); });
    DB.on(P('midiaPos'), v2 => { POS = v2; onPos(); });
    DB.on(P('historico'), v2 => { HIST = v2 || {}; renderAnot(); });
    setInterval(pres, 5000); pres();
    setTab('estudo');
    if (document.fonts) document.fonts.ready.then(() => { if (tab === 'estudo') desenhaPrev(); });
  });
}

/* =====================================================================
   ENTRADA
   ===================================================================== */
function entrada() {
  document.body.className = 'm-land';
  app.innerHTML = `<div class="land"><div class="t1">Jael</div><div class="t2">A mais abençoada das mulheres</div><div class="lgrid"><a class="lcard" href="${urlModo('controle')}"><i class="ti ti-adjustments"></i><b>Controle</b><span>Quem conduz o estudo</span></a><a class="lcard" href="${urlModo('tv')}"><i class="ti ti-device-tv"></i><b>TV</b><span>Tela de apresentação</span></a><a class="lcard" href="${urlModo('celular')}"><i class="ti ti-device-mobile"></i><b>Celular</b><span>Quem responde</span></a></div><div class="mu">Sala ${esc(SALA)}${DB.remoto ? '' : ' · modo de teste local (mesmo navegador)'}</div></div>`;
}

if (MODO === 'tv') modoTV();
else if (MODO === 'celular' || MODO === 'cel') modoCel();
else if (MODO === 'controle') modoCtl();
else entrada();
</script>
</body>
